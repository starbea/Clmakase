stages:
  - test
  - build
  - scan
  - update-manifest
  - deploy-secrets
  - deploy-frontend
  - load-test

variables:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 160884802838.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: oliveyoung-api
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  # 환경별 변수는 아래 Job 단계에서 동적으로 할당하거나 GitLab CI/CD Variables(Settings) 이용 권장

# 1. 테스트 단계 (공통)
test:
  stage: test
  image: gradle:8.5-jdk17
  script:
    - cd backend
    - gradle test --no-daemon
  only:
    - main
    - dev
    - merge_requests

# 2. 빌드 단계 (이미지 단일화: dev에서 만든 태그를 그대로 사용)
build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - cd backend
    - docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
    # main/dev 공통으로 SHA 태그 푸시 (이 태그가 운영까지 감)
    - docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    # 개발계 편의를 위해 dev일 때만 latest 태그 갱신
    - |
      if [ "$CI_COMMIT_REF_NAME" == "dev" ]; then
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest
      fi
  only:
    - main
    - dev

# 3. 보안 스캔
trivy-scan:
  stage: scan
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache aws-cli curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
  only:
    - main
    - dev

# 4. 매니페스트 업데이트 (방법 A의 핵심)
update-manifest:
  stage: update-manifest
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "gitlab-ci@clmakase.click"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
  script:
    - git fetch origin $CI_COMMIT_REF_NAME
    - git checkout $CI_COMMIT_REF_NAME
    - |
      if [ "$CI_COMMIT_REF_NAME" == "dev" ]; then
        echo "Updating DEV manifest..."
        sed -i "s|image:.*oliveyoung-api:.*|image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}|" k8s/envs/dev/deployment.yaml
        git add k8s/envs/dev/deployment.yaml
      elif [ "$CI_COMMIT_REF_NAME" == "main" ]; then
        echo "PROMOTING tested image to PROD..."
        sed -i "s|image:.*oliveyoung-api:.*|image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}|" k8s/envs/prod/deployment.yaml
        git add k8s/envs/prod/deployment.yaml
      fi
    - git diff --cached --quiet && echo "No changes" && exit 0
    - 'git commit -m "ci: update ${CI_COMMIT_REF_NAME} image to ${IMAGE_TAG} [skip ci]"'
    - git push origin $CI_COMMIT_REF_NAME
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: on_success
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: manual # 운영 반영은 신중하게 버튼 클릭

# 5. 쿠버네티스 시크릿 배포
deploy-secrets:
  stage: deploy-secrets
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x ./kubectl
    - mv ./kubectl /usr/local/bin/kubectl
    - |
      if [ "$CI_COMMIT_REF_NAME" == "main" ]; then
        CLUSTER_NAME="cloudwave-eks"
      else
        CLUSTER_NAME="cloudwave-real-eks"
      fi
      aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME
  script:
    - |
      TARGET_NS="oliveyoung"
      # DB 및 Datadog 시크릿 적용 로직 (생략 - 기존과 동일)
      kubectl create secret generic oliveyoung-db-secret --namespace $TARGET_NS --from-literal=DB_USERNAME="$DB_USERNAME" --from-literal=DB_PASSWORD="$DB_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
  only:
    - main
    - dev

# 6. 프론트엔드 배포
deploy-frontend:
  stage: deploy-frontend
  image: node:20-alpine
  variables:
    # 환경별 S3/CloudFront 변수 (GitLab Settings에서 설정 권장)
    S3_BUCKET: $S3_BUCKET
    CLOUDFRONT_ID: $CLOUDFRONT_ID
  before_script:
    - apk add --no-cache aws-cli
  script:
    - cd frontend
    - npm ci
    - npm run build
    - aws s3 sync dist/ s3://$S3_BUCKET/ --delete
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: on_success
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: manual # 프론트도 운영은 수동 승인

# 7. 부하 테스트 (운영 반영 전/후 선택적 실행)
load-test:
  stage: load-test
  image:
    name: grafana/k6:latest
    entrypoint: [""]
  script:
    - k6 run k6/load-test.js
  when: manual
  only:
    - main
    - dev
